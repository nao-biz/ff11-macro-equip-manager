[importlinter]
root_packages =
    ff11reader
    spec_manager

[importlinter:contract:domain-ui]
name = D-01 domain does not depend on UI
type = forbidden
source_modules =
    ff11reader.domain
    ff11reader.edit_values
    ff11reader.references
    ff11reader.fixes
forbidden_modules =
    ff11reader.ui
    ff11reader.workspace_ui

[importlinter:contract:cycles]
name = Report sibling dependency cycles
type = acyclic_siblings
ancestors =
    ff11reader
    spec_manager

[importlinter:contract:save-file-boundary]
name = D-05 shared file operations do not depend on save use cases
type = forbidden
source_modules =
    ff11reader.file_io
    ff11reader.file_transaction
forbidden_modules =
    ff11reader.saving
    ff11reader.macro_saving
    ff11reader.equipment_saving
    ff11reader.combined_saving
    ff11reader.book_saving
    ff11reader.elevation
    ff11reader.elevated_saving
    ff11reader.save_state
    ff11reader.ui

[importlinter:contract:save-plan-boundary]
name = D-05 save plan values do not depend on execution
