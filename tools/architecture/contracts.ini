[importlinter]
root_packages =
    ff11reader
    spec_manager

[importlinter:contract:domain-ui]
name = D-01 domain does not depend on UI
type = forbidden
source_modules =
    ff11reader.domain
    ff11reader.edit_values
    ff11reader.references
    ff11reader.fixes
forbidden_modules =
    ff11reader.ui
    ff11reader.workspace_ui

[importlinter:contract:cycles]
name = Report sibling dependency cycles
type = acyclic_siblings
ancestors =
    ff11reader
    spec_manager

[importlinter:contract:save-state-storage]
name = D-05 save coordinator uses session contract, not storage implementation
type = forbidden
source_modules =
    ff11reader.save_state
forbidden_modules =
    ff11reader.edit_state
allow_indirect_imports = true
