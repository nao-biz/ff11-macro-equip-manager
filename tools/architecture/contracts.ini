[importlinter]
root_packages =
    ff11reader
    spec_manager

[importlinter:contract:domain-ui]
name = D-01 domain does not depend on UI
type = forbidden
source_modules =
    ff11reader.domain
    ff11reader.edit_values
    ff11reader.references
    ff11reader.fixes
forbidden_modules =
    ff11reader.ui
    ff11reader.workspace_ui

[importlinter:contract:cycles]
name = Report sibling dependency cycles
type = acyclic_siblings
ancestors =
    ff11reader
    spec_manager

[importlinter:contract:save-state-storage]
name = D-05 save coordinator uses session contract, not storage implementation
type = forbidden
source_modules =
    ff11reader.save_state
forbidden_modules =
    ff11reader.edit_state
allow_indirect_imports = true

[importlinter:contract:macro-proposal]
name = D-05 macro replay builds values without save or loading orchestration
type = forbidden
source_modules =
    ff11reader.macro_save_proposal
forbidden_modules =
    ff11reader.macro_saving
    ff11reader.application
    ff11reader.adapters
    ff11reader.file_transaction
    ff11reader.edit_state
    ff11reader.ui
    ff11reader.workspace_ui
allow_indirect_imports = true

[importlinter:contract:snapshot-loading]
name = D-05 snapshot loading does not orchestrate saving or UI
type = forbidden
source_modules =
    ff11reader.snapshot_loading
forbidden_modules =
    ff11reader.application
    ff11reader.macro_saving
    ff11reader.equipment_saving
    ff11reader.file_transaction
    ff11reader.editing
    ff11reader.edit_state
    ff11reader.ui
    ff11reader.workspace_ui
allow_indirect_imports = true

[importlinter:contract:reader-boundary]
name = D-05 generic reader does not depend on save use cases
type = forbidden
source_modules =
    ff11reader.adapters
forbidden_modules =
    ff11reader.snapshot_loading
    ff11reader.macro_saving
    ff11reader.macro_save_proposal
    ff11reader.edit_state
    ff11reader.ui
    ff11reader.workspace_ui
allow_indirect_imports = true

[importlinter:contract:read-descriptors]
name = D-05 read requests and resource catalog are independent values
type = forbidden
source_modules =
    ff11reader.read_requests
    ff11reader.resource_catalog
forbidden_modules =
    ff11reader.adapters
    ff11reader.snapshot_loading
    ff11reader.loaded_files
    ff11reader.codecs
    ff11reader.macro_saving
    ff11reader.application
    ff11reader.ui

[importlinter:contract:save-inputs]
name = D-05 save input projection has no storage or execution dependencies
type = forbidden
source_modules =
    ff11reader.save_inputs
forbidden_modules =
    ff11reader.edit_state
    ff11reader.editing
    ff11reader.adapters
    ff11reader.macro_saving
    ff11reader.equipment_saving
    ff11reader.file_transaction
    ff11reader.application
    ff11reader.ui
