name: Tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FF11_RUN_GAME_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: UI responsiveness and execution boundaries (synthetic data)
        timeout-minutes: 5
        env:
          FF11_RUN_INTEGRATION: "1"
        run: python -X utf8 -B -m unittest tests.test_ui_tasks tests.test_reload tests.test_ui_actions tests.test_ui_execution -v
