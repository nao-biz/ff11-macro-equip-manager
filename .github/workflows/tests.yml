name: Tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FF11_RUN_INTEGRATION: "0"
      FF11_RUN_GAME_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Requirement and design references
        run: python -X utf8 -m spec_manager validate
      - run: python -X utf8 -B -m unittest discover -s tests -v
  synthetic-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      FF11_RUN_INTEGRATION: "1"
      FF11_RUN_GAME_INTEGRATION: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: All tests including synthetic UI
        run: python -X utf8 -B -m unittest discover -s tests -v
